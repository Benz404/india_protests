name: Suggest a protest record
description: Add or correct a protest. Any side, any cause, as long as it is sourced.
labels: [new-record]
body:
  - type: input
    attributes: {label: Title and place, placeholder: "Ranchi, Jharkhand — exam protest"}
    validations: {required: true}
  - type: input
    attributes: {label: Dates, placeholder: "Oct 5–10, 2026"}
    validations: {required: true}
  - type: dropdown
    attributes:
      label: Who is protesting? (choose the closest)
      multiple: true
      options: [Ruling party, Opposition, Students, Workers, Farmers, Environment, Civil society]
    validations: {required: true}
  - type: textarea
    attributes: {label: What happened and why (neutral wording)}
    validations: {required: true}
  - type: textarea
    attributes: {label: The other side's response (authorities, company, rival party)}
  - type: textarea
    attributes: {label: Sources (at least one link, two is better)}
    validations: {required: true}
